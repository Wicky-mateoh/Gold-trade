services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gits
      POSTGRES_USER: gits
      POSTGRES_PASSWORD: gits
    ports:
      - "5432:5432"
    volumes:
      - gits_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gits -d gits"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://gits:gits@postgres:5432/gits
      REDIS_URL: redis://redis:6379/0
      APP_MODE: analysis
      LIVE_TRADING_AUTHORIZED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gits_pg:
